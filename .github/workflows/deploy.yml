name: Deploy Ad Service with SSL

on:
  push:
    branches: [ hand_made ]

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: anton60874022/ad_service:latest

  deploy:
    name: Deploy to Server with SSL
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # === СОЗДАНИЕ .env ФАЙЛА НА GITHUB RUNNER ===
      - name: Create .env file from secrets
        run: |
          echo "🔧 Creating .env file from GitHub Secrets..."
          cat > .env << EOF
          # Django
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=${{ secrets.DEBUG }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          
          # Database
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          
          # Redis
          REDIS_URL=${{ secrets.REDIS_URL }}
          
          # Email (Mail.ru)
          EMAIL_HOST=${{ secrets.EMAIL_HOST }}
          EMAIL_PORT=${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS=${{ secrets.EMAIL_USE_TLS }}
          EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL=${{ secrets.EMAIL_HOST_USER }}
          
          # Security
          CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}
          EOF
          
          echo "✅ .env file created"
          echo "Email settings in .env:"
          grep EMAIL .env

      - name: Install Docker Compose on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "📦 Installing Docker Compose..."
            
            if command -v docker-compose &> /dev/null; then
              echo "✅ Docker Compose already installed"
              docker-compose --version
            else
              echo "Installing Docker Compose..."
              curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
              ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
              echo "✅ Docker Compose installed successfully"
              docker-compose --version
            fi

      - name: Clean server and setup directories
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🧹 Cleaning server..."
            cd /root
            
            # Останавливаем и удаляем старые контейнеры
            if [ -d "ad_service" ]; then
              cd ad_service
              echo "Stopping existing containers..."
              docker-compose down 2>/dev/null || true
              cd ..
            fi
            
            # Удаляем старые контейнеры приложения
            echo "Removing application containers..."
            docker ps -a | grep -E "(handmade_|ad_service)" | awk '{print $1}' | xargs -r docker rm -f 2>/dev/null || true
            
            # Удаляем старые образы приложения
            echo "Removing application images..."
            docker images | grep -E "(ad_service|anton60874022)" | awk '{print $3}' | xargs -r docker rmi -f 2>/dev/null || true
            
            # Очищаем Docker
            docker system prune -f 2>/dev/null || true
            
            # Удаляем и создаем директорию заново
            echo "Recreating project directory..."
            rm -rf /root/ad_service
            mkdir -p /root/ad_service/nginx
            mkdir -p /root/ad_service/logs/nginx
            
            echo "✅ Server cleaned"

      - name: Copy infrastructure files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "infra/"
          target: "/root/ad_service/"
          overwrite: true
          strip_components: 1

      # === КОПИРУЕМ .env ===
      - name: Copy .env to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ".env"
          target: "/root/ad_service/"
          overwrite: true

      - name: Ensure ports are free for Certbot
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔧 Ensuring ports 80 and 443 are free..."
            
            # Останавливаем системные сервисы
            systemctl stop nginx 2>/dev/null || echo "nginx stopped or not running"
            systemctl stop apache2 2>/dev/null || echo "apache2 stopped or not running"
            
            # Убиваем процессы на портах 80 и 443
            lsof -ti:80 | xargs -r kill -9 2>/dev/null || true
            lsof -ti:443 | xargs -r kill -9 2>/dev/null || true
            
            echo "✅ Ports should be free now"

      - name: Install Certbot and obtain SSL certificate FIRST
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            echo "🔐 Installing Certbot..."
            
            # Обновляем пакеты и устанавливаем certbot
            apt-get update
            apt-get install -y certbot
            
            echo "✅ Certbot installed"
            
            echo "Obtaining SSL certificate..."
            # Получаем SSL сертификат ДО запуска nginx
            certbot certonly --standalone \
              -d mart.ktsf.ru \
              -d www.mart.ktsf.ru \
              --non-interactive \
              --agree-tos \
              --email anton60874022@mail.ru \
              --preferred-challenges http
            
            echo "✅ SSL certificate obtained"

      - name: Deploy all containers at once
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            echo "🚀 Deploying all containers..."
            cd /root/ad_service/
            
            echo "1. Checking .env file..."
            if [ -f .env ]; then
              echo "✅ .env file exists"
            else
              echo "❌ .env file not found!"
              exit 1
            fi
            
            echo "2. Logging in to Docker Hub..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            echo "3. Pulling latest application image..."
            docker pull anton60874022/ad_service:latest
            
            echo "4. Starting ALL containers..."
            docker-compose up -d
            
            echo "5. Waiting for database to be ready..."
            for i in {1..30}; do
              if docker-compose exec -T db pg_isready -U postgres 2>/dev/null; then
                echo "✅ Database is ready!"
                break
              else
                echo "⏳ Waiting for database... ($i/30)"
                sleep 2
              fi
            done
            
            echo "6. Running migrations..."
            docker-compose exec -T web python manage.py migrate --noinput
            
            echo "7. Collecting static files..."
            docker-compose exec -T web python manage.py collectstatic --noinput --clear || echo "Static collection completed"
            
            echo "✅ All containers deployed!"

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔍 Verifying deployment..."
            cd /root/ad_service/
            
            echo "1. Container status:"
            docker-compose ps
            
            echo "2. Waiting for services to stabilize..."
            sleep 10
            
            echo "3. Checking nginx configuration..."
            docker-compose exec nginx nginx -t && echo "✅ Nginx config OK"
            
            echo "4. Testing HTTPS internally..."
            if curl -f -H "Host: mart.ktsf.ru" https://localhost/ --insecure --connect-timeout 10; then
              echo "✅ HTTPS is working!"
            else
              echo "⚠️  HTTPS test failed, checking logs..."
              docker-compose logs web --tail=20
              docker-compose logs nginx --tail=20
            fi
            
            echo "5. Basic health check..."
            docker-compose exec web python -c "
            import os
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'ad_service.settings')
            import django
            django.setup()
            print('✅ Django can be initialized')
            "

      - name: Setup SSL certificate auto-renewal
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔄 Setting up SSL certificate auto-renewal..."
            
            # Создаем скрипт для обновления сертификатов
            cat > /root/renew_ssl.sh << 'EOF'
            #!/bin/bash
            echo "$(date): Starting SSL certificate renewal..."
            
            # Останавливаем nginx временно
            cd /root/ad_service
            docker-compose stop nginx
            
            # Обновляем сертификаты
            if certbot renew --standalone --non-interactive; then
                echo "SSL certificates renewed successfully"
                # Запускаем nginx обратно
                docker-compose start nginx
                # Перезагружаем конфигурацию nginx
                docker-compose exec nginx nginx -s reload
                echo "Nginx restarted with new certificates"
            else
                echo "SSL certificate renewal failed"
                # В любом случае запускаем nginx обратно
                docker-compose start nginx
            fi
            EOF
            
            chmod +x /root/renew_ssl.sh
            
            # Добавляем cron задачу
            (crontab -l 2>/dev/null; echo "0 3 * * * /root/renew_ssl.sh >> /var/log/ssl-renewal.log 2>&1") | crontab -
            
            echo "✅ SSL auto-renewal configured!"

      - name: Final test from runner
        run: |
          echo "🔍 Final test from GitHub runner..."
          echo "Waiting for DNS and services to stabilize..."
          sleep 30
          
          for i in {1..5}; do
            echo "Attempt $i/5 to connect to https://mart.ktsf.ru..."
            if curl -f -m 30 https://mart.ktsf.ru/ 2>/dev/null; then
              echo "✅ Site is accessible!"
              break
            else
              echo "Attempt $i failed, waiting 10 seconds..."
              sleep 10
            fi
          done || echo "⚠️  Could not connect, but deployment may still be successful"