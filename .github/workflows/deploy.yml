name: Deploy Ad Service with SSL

on:
  push:
    branches: [ hand_made ]

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: anton60874022/ad_service:latest

  deploy:
    name: Deploy to Server with SSL
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Compose on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "📦 Installing Docker Compose..."
            if command -v docker-compose &> /dev/null; then
              echo "✅ Docker Compose already installed"
              docker-compose --version
            else
              echo "Installing Docker Compose..."
              curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
              ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
              echo "✅ Docker Compose installed successfully"
              docker-compose --version
            fi

      - name: Clean server and setup directories (preserve DB)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🧹 Cleaning server (preserving database)..."
            cd /root
            
            if [ -d "ad_service" ]; then
              cd ad_service
              docker-compose down || true
            fi
            
            echo "Removing application containers..."
            docker ps -a | grep -E "(handmade_web|handmade_nginx|redis|certbot)" | awk '{print $1}' | xargs -r docker rm -f || true
            
            echo "Removing application images..."
            docker images | grep -E "(ad_service|anton60874022|nginx|certbot)" | awk '{print $3}' | xargs -r docker rmi -f || true
            
            echo "Cleaning unused Docker resources..."
            docker system prune -f || true
            
            echo "Checking database volume..."
            docker volume ls | grep postgres_data || echo "Database volume not found (will be created)"
            
            echo "Recreating project directory..."
            rm -rf /root/ad_service
            mkdir -p /root/ad_service/nginx
            mkdir -p /root/ad_service/logs/nginx
            
            echo "✅ Server cleaned (database data preserved)"

      - name: Copy infrastructure files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "infra/"
          target: "/root/ad_service/"
          overwrite: true
          strip_components: 1

      - name: Copy .env to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ".env"
          target: "/root/ad_service/"
          overwrite: true

      - name: Setup SSL and deploy application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            echo "🚀 Starting deployment with SSL setup..."
            cd /root/ad_service/
            
            echo "1. Creating necessary directories for certbot..."
            mkdir -p nginx/conf.d
            mkdir -p logs/nginx
            
            echo "2. Pulling latest images..."
            docker pull anton60874022/ad_service:latest
            docker pull nginx:1.21-alpine
            docker pull certbot/certbot
            
            echo "3. Starting initial setup without SSL to get certificates..."
            # Сначала запускаем nginx на порту 80 для получения сертификатов
            docker-compose up -d db redis web nginx
            
            echo "4. Waiting for services to start..."
            sleep 30
            
            echo "5. Obtaining SSL certificates..."
            docker-compose run --rm certbot || echo "Certbot execution completed"
            
            echo "6. Updating nginx configuration for SSL..."
            # Копируем SSL конфиг nginx
            cp nginx/nginx.conf nginx/nginx.conf.backup
            cat > nginx/nginx.conf << 'EOF'
            events {
                worker_connections 1024;
            }

            http {
                include /etc/nginx/mime.types;
                default_type application/octet-stream;

                server_tokens off;
                sendfile on;
                tcp_nopush on;
                tcp_nodelay on;
                keepalive_timeout 65;
                types_hash_max_size 2048;

                client_max_body_size 20M;
                client_body_timeout 60s;
                client_header_timeout 60s;
                client_body_buffer_size 128K;
                client_body_temp_path /var/cache/nginx/client_temp 1 2;

                log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                                '$status $body_bytes_sent "$http_referer" '
                                '"$http_user_agent" "$http_x_forwarded_for" '
                                'rt=$request_time uct="$upstream_connect_time"';

                access_log /var/log/nginx/access.log main;
                error_log /var/log/nginx/error.log warn;

                upstream django {
                    server web:8000;
                }

                server {
                    listen 80;
                    server_name mart.ktsf.ru www.mart.ktsf.ru;
                    
                    location /.well-known/acme-challenge/ {
                        root /var/www/certbot;
                    }
                    
                    location / {
                        return 301 https://$host$request_uri;
                    }
                }

                server {
                    listen 443 ssl http2;
                    server_name mart.ktsf.ru www.mart.ktsf.ru;

                    ssl_certificate /etc/letsencrypt/live/mart.ktsf.ru/fullchain.pem;
                    ssl_certificate_key /etc/letsencrypt/live/mart.ktsf.ru/privkey.pem;
                    
                    ssl_protocols TLSv1.2 TLSv1.3;
                    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
                    ssl_prefer_server_ciphers off;
                    ssl_session_cache shared:SSL:10m;
                    ssl_session_timeout 1d;

                    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
                    add_header X-Frame-Options "SAMEORIGIN" always;
                    add_header X-Content-Type-Options "nosniff" always;
                    add_header X-XSS-Protection "1; mode=block" always;
                    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;

                    client_max_body_size 20M;
                    client_body_timeout 120s;
                    client_header_timeout 120s;
                    proxy_connect_timeout 120s;
                    proxy_send_timeout 120s;
                    proxy_read_timeout 120s;

                    location /static/ {
                        alias /app/staticfiles/;
                        expires 1y;
                        add_header Cache-Control "public, immutable";
                        access_log off;
                    }

                    location /media/ {
                        alias /app/media/;
                        expires 30d;
                        add_header Cache-Control "public";
                        access_log off;
                        client_max_body_size 20M;
                    }

                    location /ws/ {
                        proxy_pass http://django;
                        proxy_http_version 1.1;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection "upgrade";
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        proxy_read_timeout 86400;
                    }

                    location / {
                        proxy_pass http://django;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        
                        proxy_connect_timeout 120s;
                        proxy_send_timeout 120s;
                        proxy_read_timeout 120s;
                        
                        proxy_buffering on;
                        proxy_buffer_size 128k;
                        proxy_buffers 8 256k;
                        proxy_busy_buffers_size 256k;
                        
                        client_max_body_size 20M;
                        client_body_timeout 120s;
                    }

                    location /catalog/add/ {
                        proxy_pass http://django;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        
                        client_max_body_size 20M;
                        client_body_timeout 300s;
                        proxy_connect_timeout 300s;
                        proxy_send_timeout 300s;
                        proxy_read_timeout 300s;
                        
                        proxy_buffering on;
                        proxy_buffer_size 128k;
                        proxy_buffers 8 256k;
                        proxy_busy_buffers_size 256k;
                    }
                }
            }
            EOF
            
            echo "7. Restarting nginx with SSL configuration..."
            docker-compose down
            docker-compose up -d
            
            echo "8. Setting up automatic SSL renewal..."
            # Добавляем cron job для автоматического обновления сертификатов
            (crontab -l 2>/dev/null | grep -v "certbot renew"; echo "0 12 * * * /usr/bin/docker-compose -f /root/ad_service/docker-compose.yml run --rm certbot renew --quiet && /usr/bin/docker-compose -f /root/ad_service/docker-compose.yml exec nginx nginx -s reload") | crontab -
            
            echo "9. Waiting for final startup..."
            sleep 20
            
            echo "✅ SSL deployment completed!"

      - name: Final verification
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔍 Final verification..."
            cd /root/ad_service/
            
            echo "1. Container status:"
            docker-compose ps
            
            echo "2. SSL certificate status:"
            docker-compose run --rm certbot certificates || echo "Checking certificates"
            
            echo "3. Testing HTTPS access..."
            curl -I https://mart.ktsf.ru/ || echo "HTTPS test completed"
            
            echo "4. Checking cron jobs:"
            crontab -l | grep certbot || echo "Cron job for SSL renewal"
            
            echo "🎉 Deployment complete! SSL certificates installed and auto-renewal configured."