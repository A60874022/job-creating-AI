name: Deploy Ad Service

on:
  push:
    branches: [ hand_made ]

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: anton60874022/ad_service:latest

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Compose on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "📦 Installing Docker Compose..."
            
            # Проверяем, установлен ли уже docker compose
            if command -v docker-compose &> /dev/null; then
              echo "✅ Docker Compose already installed"
              docker-compose --version
            else
              echo "Installing Docker Compose..."
              # Скачиваем и устанавливаем Docker Compose
              curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
              ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
              echo "✅ Docker Compose installed successfully"
              docker-compose --version
            fi

      - name: Clean server and setup directories (preserve DB)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🧹 Cleaning server (preserving database)..."
            cd /root
            
            # Останавливаем контейнеры если есть (сохраняем тома)
            if [ -d "ad_service" ]; then
              cd ad_service
              docker-compose down || true
            fi
            
            # Удаляем только контейнеры приложения, НЕ тома БД
            echo "Removing application containers..."
            docker ps -a | grep -E "(handmade_web|handmade_nginx|redis)" | awk '{print $1}' | xargs -r docker rm -f || true
            
            # Удаляем образы приложения, но не postgres
            echo "Remaining application images..."
            docker images | grep -E "(ad_service|anton60874022)" | awk '{print $3}' | xargs -r docker rmi -f || true
            
            # Очищаем неиспользуемые ресурсы, но сохраняем тома
            echo "Cleaning unused Docker resources..."
            docker system prune -f || true
            
            # Проверяем что том БД существует
            echo "Checking database volume..."
            docker volume ls | grep postgres_data || echo "Database volume not found (will be created)"
            
            # Очищаем и пересоздаем папку проекта (тома БД сохраняются автоматически)
            echo "Recreating project directory..."
            rm -rf /root/ad_service
            mkdir -p /root/ad_service/nginx
            mkdir -p /root/ad_service/logs/nginx
            
            echo "✅ Server cleaned (database data preserved)"

      - name: Copy infrastructure files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "infra/"
          target: "/root/ad_service/"
          overwrite: true
          strip_components: 1

      - name: Copy .env to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ".env"
          target: "/root/ad_service/"
          overwrite: true

      - name: Deploy application with domain configuration
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            echo "🚀 Starting deployment with domain configuration..."
            cd /root/ad_service/
            
            echo "=== Current directory structure ==="
            ls -la
            echo "=== Nginx configuration ==="
            ls -la nginx/ || echo "Nginx directory not found"
            
            echo "1. Logging in to Docker Hub..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            echo "2. Testing nginx configuration syntax..."
            docker-compose exec nginx nginx -t || echo "Nginx test will be done after start"
            
            echo "3. Pulling latest application image..."
            docker pull anton60874022/ad_service:latest
            
            echo "4. Starting containers (database volume will be reused)..."
            docker-compose up -d
            
            echo "5. Waiting for database to be ready..."
            # Ждем пока PostgreSQL будет готов принимать подключения
            for i in {1..30}; do
              if docker-compose exec -T db pg_isready -U postgres; then
                echo "✅ Database is ready!"
                break
              else
                echo "⏳ Waiting for database... ($i/30)"
                sleep 2
              fi
            done
            
            echo "6. Waiting for application to start..."
            sleep 20
            
            echo "7. Running migrations..."
            docker-compose exec -T web python manage.py migrate --noinput
            
            echo "8. Collecting static files..."
            docker-compose exec -T web python manage.py collectstatic --noinput --clear || echo "Static collection warning"
            
            echo "9. Testing nginx configuration..."
            docker-compose exec nginx nginx -t && echo "✅ Nginx configuration is valid"
            
            echo "10. Restarting nginx to apply domain configuration..."
            docker-compose restart nginx
            
            echo "11. Checking services status..."
            docker-compose ps
            
            echo "✅ Deployment with domain configuration completed!"

      - name: Verify domain deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔍 Domain deployment verification..."
            cd /root/ad_service/
            
            echo "1. Container status:"
            docker-compose ps
            
            echo "2. Checking nginx logs for errors..."
            docker-compose logs nginx --tail=20 | grep -i error || echo "No nginx errors found"
            
            echo "3. Checking application logs..."
            docker-compose logs web --tail=10
            
            echo "4. Testing domain accessibility (mart.ktsf.ru)..."
            # Тестируем с правильным Host header
            if curl -f -H "Host: mart.ktsf.ru" http://localhost/; then
              echo "✅ Domain mart.ktsf.ru is accessible via Host header"
            else
              echo "⚠️  Domain test via Host header failed, checking direct access..."
              curl -f http://localhost/ || echo "Direct access also failed"
            fi
            
            echo "5. Testing static files..."
            if curl -f -H "Host: mart.ktsf.ru" http://localhost/static/admin/css/base.css > /dev/null 2>&1; then
              echo "✅ Static files are serving correctly"
            else
              echo "⚠️  Static files check failed"
            fi
            
            echo "6. Testing media files configuration..."
            if curl -f -H "Host: mart.ktsf.ru" http://localhost/media/ > /dev/null 2>&1; then
              echo "✅ Media URL is configured"
            else
              echo "ℹ️  Media URL check (expected 404 for directory listing)"
            fi
            
            echo "7. Checking if application can connect to database..."
            docker-compose exec -T web python manage.py check --database default && echo "✅ Database connection OK"
            
            echo "🎉 Domain deployment verification complete!"
            echo "🌐 Your site should now be available at: http://mart.ktsf.ru"

      - name: Final domain test from runner
        run: |
          echo "🔍 Testing domain from GitHub runner..."
          echo "Note: This test might fail if DNS hasn't propagated yet"
          sleep 10
          curl -f http://mart.ktsf.ru/ && echo "✅ Domain is accessible from internet" || echo "⚠️  Domain might not be accessible yet (DNS propagation)"