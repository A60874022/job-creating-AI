name: Deploy Ad Service

on:
  push:
    branches: [ main ]  # Исправлено на main, проверь название своей ветки

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: anton60874022/ad_service:latest
          cache-from: type=registry,ref=anton60874022/ad_service:latest
          cache-to: type=inline

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Deploy application via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e  # Выход при ошибке
            
            echo "🚀 Starting deployment..."
            cd /root/ad_service/
            
            echo "1. Pulling latest images..."
            docker pull anton60874022/ad_service:latest
            
            echo "2. Stopping existing containers..."
            docker-compose down --remove-orphans || true
            
            echo "3. Checking directory structure..."
            mkdir -p nginx/conf.d logs/nginx
            
            echo "4. Starting services..."
            docker-compose up -d
            
            echo "5. Waiting for services to be healthy..."
            sleep 30
            
            echo "6. Running database migrations..."
            docker-compose exec -T web python manage.py migrate --noinput || echo "Migrations might have failed, continuing..."
            
            echo "7. Collecting static files..."
            docker-compose exec -T web python manage.py collectstatic --noinput --clear || echo "Static collection might have failed"
            
            echo "8. Checking service status..."
            docker-compose ps
            
            echo "9. Checking application health..."
            for i in {1..10}; do
              if curl -f http://localhost:8000/ || curl -f http://localhost/; then
                echo "✅ Application is responding correctly"
                break
              else
                echo "⏳ Application not ready yet, attempt $i/10"
                sleep 10
              fi
            done
            
            echo "✅ Deployment completed successfully!"