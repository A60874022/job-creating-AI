name: Deploy Ad Service with SSL

on:
  push:
    branches: [ hand_made ]

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: anton60874022/ad_service:latest

  deploy:
    name: Deploy to Server with SSL
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Compose on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "📦 Installing Docker Compose..."
            if command -v docker-compose &> /dev/null; then
              echo "✅ Docker Compose already installed"
            else
              curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
              ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
              echo "✅ Docker Compose installed"
            fi

      - name: Clean server and setup directories
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🧹 Cleaning server..."
            cd /root
            
            if [ -d "ad_service" ]; then
              cd ad_service
              docker-compose down || true
            fi
            
            docker ps -a | grep -E "(handmade_web|handmade_nginx|handmade_certbot|redis)" | awk '{print $1}' | xargs -r docker rm -f || true
            docker images | grep -E "(ad_service|anton60874022)" | awk '{print $3}' | xargs -r docker rmi -f || true
            docker system prune -f || true
            
            rm -rf /root/ad_service
            mkdir -p /root/ad_service/nginx/conf.d
            mkdir -p /root/ad_service/logs/nginx
            mkdir -p /root/ad_service/certbot_www
            mkdir -p /root/ad_service/certbot_data
            
            echo "✅ Server cleaned and directories created"

      - name: Copy infrastructure files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "infra/"
          target: "/root/ad_service/"
          overwrite: true
          strip_components: 1

      - name: Copy SSL script
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "certbot-renew.sh"
          target: "/root/ad_service/"
          overwrite: true

      - name: Copy environment file
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ".env"
          target: "/root/ad_service/"
          overwrite: true

      - name: Deploy application with SSL
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            echo "🚀 Starting deployment with SSL..."
            cd /root/ad_service/
            
            echo "1. Making SSL script executable..."
            chmod +x certbot-renew.sh
            
            echo "2. Pulling latest application image..."
            docker pull anton60874022/ad_service:latest
            
            echo "3. Starting database and application..."
            docker-compose up -d db redis web
            
            echo "4. Waiting for services to start..."
            sleep 15
            
            echo "5. Setting up SSL certificate..."
            ./certbot-renew.sh
            
            echo "6. Running migrations..."
            docker-compose exec -T web python manage.py migrate --noinput
            
            echo "7. Checking services status..."
            docker-compose ps
            
            echo "✅ Deployment completed! Visit: https://mart.ktsf.ru"

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔍 Verifying deployment..."
            cd /root/ad_service/
            
            echo "1. Container status:"
            docker-compose ps
            
            echo "2. Checking SSL configuration..."
            docker-compose exec nginx nginx -t && echo "✅ SSL configuration is valid"
            
            echo "3. Checking certificate renewal cron job..."
            crontab -l | grep certbot && echo "✅ Auto-renewal is set up" || echo "⚠️  Auto-renewal not set up"
            
            echo "🎉 Deployment verification complete!"