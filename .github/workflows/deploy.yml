name: Deploy Ad Service with SSL

on:
  push:
    branches: [ hand_made ]

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: anton60874022/ad_service:latest

  deploy:
    name: Deploy to Server with SSL
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # === СОЗДАНИЕ .env ФАЙЛА НА GITHUB RUNNER ===
      - name: Create .env file from secrets
        run: |
          echo "🔧 Creating .env file from GitHub Secrets..."
          cat > .env << EOF
          # Database
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/${{ secrets.POSTGRES_DB }}
          
          # Django
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG=${{ secrets.DJANGO_DEBUG }}
          DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}
          
          # Redis
          REDIS_URL=redis://redis:6379/0
          
          # Other settings
          CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          EOF
          
          echo "✅ .env file created"
          echo "First 3 lines (for verification):"
          head -3 .env

      - name: Install Docker Compose on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "📦 Installing Docker Compose..."
            
            if command -v docker-compose &> /dev/null; then
              echo "✅ Docker Compose already installed"
              docker-compose --version
            else
              echo "Installing Docker Compose..."
              curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
              ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
              echo "✅ Docker Compose installed successfully"
              docker-compose --version
            fi

      - name: Clean server and setup directories (preserve DB)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🧹 Cleaning server (preserving database)..."
            cd /root
            
            # Останавливаем и удаляем все контейнеры
            echo "Stopping all Docker containers..."
            docker stop $(docker ps -aq) 2>/dev/null || true
            docker rm $(docker ps -aq) 2>/dev/null || true
            
            if [ -d "ad_service" ]; then
              cd ad_service
              docker-compose down || true
            fi
            
            echo "Removing application containers..."
            docker ps -a | grep -E "(handmade_web|handmade_nginx|redis)" | awk '{print $1}' | xargs -r docker rm -f || true
            
            echo "Remaining application images..."
            docker images | grep -E "(ad_service|anton60874022)" | awk '{print $3}' | xargs -r docker rmi -f || true
            
            echo "Cleaning unused Docker resources..."
            docker system prune -f || true
            
            echo "Checking database volume..."
            docker volume ls | grep postgres_data || echo "Database volume not found (will be created)"
            
            echo "Recreating project directory..."
            rm -rf /root/ad_service
            mkdir -p /root/ad_service/nginx
            mkdir -p /root/ad_service/logs/nginx
            
            echo "✅ Server cleaned (database data preserved)"

      - name: Copy infrastructure files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "infra/"
          target: "/root/ad_service/"
          overwrite: true
          strip_components: 1

      # === ТЕПЕРЬ .env СУЩЕСТВУЕТ И ЕГО МОЖНО СКОПИРОВАТЬ ===
      - name: Copy .env to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ".env"
          target: "/root/ad_service/"
          overwrite: true

      - name: Ensure ports are free
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔧 Ensuring ports 80 and 443 are free..."
            
            # Простая проверка и очистка портов
            echo "Checking port status:"
            netstat -tulpn | grep -E ':(80|443)' || echo "Ports are free"
            
            # Останавливаем только системные сервисы (без убийства процессов)
            systemctl stop nginx 2>/dev/null || echo "nginx was not running"
            systemctl stop apache2 2>/dev/null || echo "apache2 was not running"
            
            echo "✅ Port check completed"

      - name: Deploy application first (without nginx)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            echo "🚀 Starting initial deployment (without nginx)..."
            cd /root/ad_service/
            
            echo "1. Logging in to Docker Hub..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            echo "2. Pulling latest application image..."
            docker pull anton60874022/ad_service:latest
            
            echo "3. Starting containers without nginx..."
            # Запускаем все сервисы кроме nginx сначала
            docker-compose up -d db redis web
            
            echo "4. Waiting for database to be ready..."
            for i in {1..30}; do
              if docker-compose exec -T db pg_isready -U postgres; then
                echo "✅ Database is ready!"
                break
              else
                echo "⏳ Waiting for database... ($i/30)"
                sleep 2
              fi
            done
            
            echo "5. Waiting for application to start..."
            sleep 15
            
            echo "6. Running migrations..."
            docker-compose exec -T web python manage.py migrate --noinput
            
            echo "7. Collecting static files..."
            docker-compose exec -T web python manage.py collectstatic --noinput --clear || echo "Static collection warning"
            
            echo "✅ Initial deployment completed!"

      - name: Install Certbot and obtain SSL certificate using standalone
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            echo "🔐 Installing Certbot and obtaining SSL certificate..."
            
            # Обновляем пакеты и устанавливаем Certbot
            apt-get update
            apt-get install -y certbot
            
            echo "✅ Certbot installed successfully"
            
            echo "Obtaining SSL certificate using standalone method..."
            # Получаем SSL сертификат (порт 80 должен быть свободен)
            certbot certonly --standalone -d mart.ktsf.ru -d www.mart.ktsf.ru --non-interactive --agree-tos --email ${{ secrets.ADMIN_EMAIL }}
            
            echo "✅ SSL certificate obtained successfully!"

      - name: Deploy nginx with SSL configuration
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            echo "🚀 Deploying nginx with SSL configuration..."
            cd /root/ad_service/
            
            echo "1. Starting nginx container..."
            docker-compose up -d nginx
            
            echo "2. Waiting for nginx to start..."
            sleep 5
            
            echo "3. Testing nginx configuration..."
            docker-compose exec nginx nginx -t && echo "✅ Nginx configuration is valid"
            
            echo "4. Checking all services status..."
            docker-compose ps
            
            echo "✅ Nginx deployment completed!"

      - name: Setup SSL certificate auto-renewal
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔄 Setting up SSL certificate auto-renewal..."
            
            # Создаем скрипт для обновления сертификатов
            cat > /root/renew_ssl.sh << 'EOF'
            #!/bin/bash
            echo "$(date): Starting SSL certificate renewal..."
            
            # Останавливаем nginx временно
            cd /root/ad_service
            docker-compose stop nginx
            
            # Обновляем сертификаты
            if certbot renew --standalone --non-interactive; then
                echo "SSL certificates renewed successfully"
                # Запускаем nginx обратно
                docker-compose start nginx
                echo "Nginx restarted with new certificates"
            else
                echo "SSL certificate renewal failed"
                # В любом случае запускаем nginx обратно
                docker-compose start nginx
            fi
            EOF
            
            chmod +x /root/renew_ssl.sh
            
            # Добавляем cron задачу для обновления сертификатов
            (crontab -l 2>/dev/null; echo "0 3 * * * /root/renew_ssl.sh >> /var/log/ssl-renewal.log 2>&1") | crontab -
            
            echo "✅ SSL auto-renewal configured!"

      - name: Verify HTTPS deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔍 HTTPS deployment verification..."
            cd /root/ad_service/
            
            echo "1. Container status:"
            docker-compose ps
            
            echo "2. Checking nginx logs for errors..."
            docker-compose logs nginx --tail=20 | grep -i error || echo "No nginx errors found"
            
            echo "3. Testing HTTPS accessibility internally..."
            if curl -f -H "Host: mart.ktsf.ru" https://localhost/ --insecure; then
              echo "✅ HTTPS is working internally!"
            else
              echo "⚠️  HTTPS internal test failed"
            fi
            
            echo "4. Testing HTTP to HTTPS redirect..."
            REDIRECT_OUTPUT=$(curl -I -H "Host: mart.ktsf.ru" http://localhost/ 2>/dev/null | head -n 1)
            if echo "$REDIRECT_OUTPUT" | grep -q "301"; then
              echo "✅ HTTP to HTTPS redirect is working"
            else
              echo "⚠️  HTTP to HTTPS redirect test failed"
            fi
            
            echo "5. Testing static files over HTTPS..."
            if curl -f -H "Host: mart.ktsf.ru" https://localhost/static/admin/css/base.css --insecure > /dev/null 2>&1; then
              echo "✅ Static files are serving correctly over HTTPS"
            else
              echo "⚠️  Static files HTTPS check failed"
            fi
            
            echo "6. Checking SSL certificate..."
            if command -v openssl > /dev/null; then
              openssl s_client -connect localhost:443 -servername mart.ktsf.ru < /dev/null 2>/dev/null | openssl x509 -noout -dates && echo "✅ SSL certificate is valid"
            else
              echo "ℹ️  openssl not available, skipping certificate check"
            fi
            
            echo "🎉 HTTPS deployment verification complete!"
            echo "🔒 Your site is now available at: https://mart.ktsf.ru"

      - name: Final HTTPS test from runner
        run: |
          echo "🔍 Testing HTTPS from GitHub runner..."
          echo "Note: This test might fail if DNS hasn't propagated yet"
          sleep 10
          if curl -f https://mart.ktsf.ru/; then
            echo "✅ HTTPS domain is accessible from internet"
          else
            echo "⚠️  Domain might not be accessible yet (DNS propagation or other issues)"
          fi