name: Deploy Ad Service with SSL

on:
  push:
    branches: [ hand_made ]

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: anton60874022/ad_service:latest

  deploy:
    name: Deploy to Server with SSL
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Compose on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "📦 Installing Docker Compose..."
            if command -v docker-compose &> /dev/null; then
              echo "✅ Docker Compose already installed"
              docker-compose --version
            else
              echo "Installing Docker Compose..."
              curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
              ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
              echo "✅ Docker Compose installed successfully"
              docker-compose --version
            fi

      - name: Clean server and setup directories
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🧹 Cleaning server (preserving database)..."
            cd /root
            
            if [ -d "ad_service" ]; then
              cd ad_service
              docker-compose down || true
            fi
            
            echo "Removing application containers..."
            docker ps -a | grep -E "(handmade_web|handmade_nginx|redis|certbot)" | awk '{print $1}' | xargs -r docker rm -f || true
            
            echo "Removing application images..."
            docker images | grep -E "(ad_service|anton60874022)" | awk '{print $3}' | xargs -r docker rmi -f || true
            
            echo "Cleaning unused Docker resources..."
            docker system prune -f || true
            
            echo "Checking database volume..."
            docker volume ls | grep postgres_data || echo "Database volume not found (will be created)"
            
            echo "Recreating project directory..."
            rm -rf /root/ad_service
            mkdir -p /root/ad_service/nginx
            mkdir -p /root/ad_service/logs/nginx
            
            echo "✅ Server cleaned"

      - name: Copy infrastructure files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "infra/"
          target: "/root/ad_service/"
          overwrite: true
          strip_components: 1

      - name: Copy .env to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ".env"
          target: "/root/ad_service/"
          overwrite: true

      - name: Deploy application and setup SSL
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            echo "🚀 Starting deployment with SSL setup..."
            cd /root/ad_service/
            
            echo "1. Updating docker-compose with your email for SSL..."
            # Замените your-email@example.com на ваш реальный email
            sed -i 's/your-email@example.com/'"${{ secrets.ADMIN_EMAIL }}"'/' docker-compose.yml
            
            echo "2. Starting initial containers (without SSL)..."
            # Временно запускаем без certbot для получения SSL сертификата
            docker-compose up -d web db redis nginx
            
            echo "3. Waiting for services to start..."
            sleep 30
            
            echo "4. Running migrations..."
            docker-compose exec -T web python manage.py migrate --noinput
            
            echo "5. Collecting static files..."
            docker-compose exec -T web python manage.py collectstatic --noinput --clear
            
            echo "6. Obtaining SSL certificate..."
            # Получаем SSL сертификат
            docker-compose run --rm certbot || echo "Certbot might need domain verification"
            
            echo "7. Restarting nginx with SSL configuration..."
            docker-compose restart nginx
            
            echo "8. Setting up SSL auto-renewal..."
            # Добавляем автоматическое обновление SSL в cron
            (crontab -l 2>/dev/null; echo "0 12 * * * /usr/local/bin/docker-compose -f /root/ad_service/docker-compose.yml run --rm certbot renew && docker-compose -f /root/ad_service/docker-compose.yml restart nginx") | crontab -
            
            echo "✅ SSL deployment completed!"

      - name: Verify SSL deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔍 SSL deployment verification..."
            cd /root/ad_service/
            
            echo "1. Container status:"
            docker-compose ps
            
            echo "2. Checking SSL certificate..."
            docker-compose exec nginx ls -la /etc/letsencrypt/live/mart.ktsf.ru/ || echo "Checking certificate location"
            
            echo "3. Testing HTTPS redirect..."
            curl -I http://mart.ktsf.ru | grep "301 Moved Permanently" && echo "✅ HTTP to HTTPS redirect working"
            
            echo "4. Testing HTTPS connection..."
            curl -f https://mart.ktsf.ru/ && echo "✅ HTTPS is working!" || echo "⚠️  HTTPS test failed"
            
            echo "5. Checking SSL certificate validity..."
            docker-compose exec nginx openssl x509 -in /etc/letsencrypt/live/mart.ktsf.ru/cert.pem -noout -dates
            
            echo "🎉 SSL deployment verification complete!"
            echo "🔒 Your site is now available at: https://mart.ktsf.ru"