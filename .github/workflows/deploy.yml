name: Deploy Ad Service with SSL

on:
  push:
    branches: [ hand_made ]

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: anton60874022/ad_service:latest

  deploy:
    name: Deploy to Server with SSL
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Compose on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "📦 Installing Docker Compose..."
            if command -v docker-compose &> /dev/null; then
              echo "✅ Docker Compose already installed"
              docker-compose --version
            else
              echo "Installing Docker Compose..."
              curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
              ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
              echo "✅ Docker Compose installed successfully"
              docker-compose --version
            fi

      - name: Clean server and setup directories (preserve DB)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🧹 Cleaning server (preserving database)..."
            cd /root
            
            if [ -d "ad_service" ]; then
              cd ad_service
              docker-compose down || true
            fi
            
            echo "Removing application containers..."
            docker ps -a | grep -E "(ad_service_web|ad_service_nginx|ad_service_redis|ad_service_certbot)" | awk '{print $1}' | xargs -r docker rm -f || true
            
            echo "Removing application images..."
            docker images | grep -E "(ad_service|anton60874022|nginx|certbot)" | awk '{print $3}' | xargs -r docker rmi -f || true
            
            echo "Cleaning unused Docker resources..."
            docker system prune -f || true
            
            echo "Checking database volume..."
            docker volume ls | grep postgres_data || echo "Database volume not found (will be created)"
            
            echo "Recreating project directory..."
            rm -rf /root/ad_service
            mkdir -p /root/ad_service/nginx
            mkdir -p /root/ad_service/logs/nginx
            
            echo "✅ Server cleaned (database data preserved)"

      - name: Copy infrastructure files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "infra/"
          target: "/root/ad_service/"
          overwrite: true
          strip_components: 1

      - name: Copy .env to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ".env"
          target: "/root/ad_service/"
          overwrite: true

      - name: Setup SSL and deploy application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            echo "🚀 Starting deployment with SSL setup..."
            cd /root/ad_service/
            
            echo "1. Creating necessary directories for certbot..."
            mkdir -p nginx/conf.d
            mkdir -p logs/nginx
            
            echo "2. Pulling latest images..."
            docker pull anton60874022/ad_service:latest
            docker pull nginx:1.21-alpine
            docker pull certbot/certbot
            docker pull postgres:13
            docker pull redis:7-alpine
            
            echo "3. Starting database and redis first..."
            docker-compose up -d db redis
            
            echo "4. Waiting for database to be ready..."
            sleep 30
            
            echo "5. Starting web service..."
            docker-compose up -d web
            
            echo "6. Waiting for web to initialize..."
            sleep 20
            
            echo "7. Starting nginx for certificate setup..."
            docker-compose up -d nginx
            
            echo "8. Obtaining SSL certificates..."
            docker-compose run --rm certbot || echo "Certbot execution completed"
            
            echo "9. Restarting all services with proper configuration..."
            docker-compose down
            docker-compose up -d
            
            echo "10. Setting up automatic SSL renewal..."
            (crontab -l 2>/dev/null | grep -v "certbot renew"; echo "0 12 * * * /usr/bin/docker-compose -f /root/ad_service/docker-compose.yml run --rm certbot renew --quiet && /usr/bin/docker-compose -f /root/ad_service/docker-compose.yml exec nginx nginx -s reload") | crontab -
            
            echo "✅ SSL deployment completed!"

      - name: Final verification
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔍 Final verification..."
            cd /root/ad_service/
            
            echo "1. Container status:"
            docker-compose ps
            
            echo "2. Checking service health..."
            sleep 10
            docker-compose logs web --tail=20
            
            echo "3. SSL certificate status:"
            docker-compose run --rm certbot certificates || echo "Checking certificates"
            
            echo "4. Testing HTTPS access..."
            curl -I https://mart.ktsf.ru/ || echo "HTTPS test completed"
            
            echo "5. Checking cron jobs:"
            crontab -l | grep certbot || echo "Cron job for SSL renewal"
            
            echo "🎉 Deployment complete! SSL certificates installed and auto-renewal configured."