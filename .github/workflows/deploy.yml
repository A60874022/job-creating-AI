name: Workflow For Build and Deploy

on:
  push:
    branches:
      - hand_made

jobs:
  build_backend_and_push_to_docker_hub:
    name: Push docker image of backend to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: anton60874022/ad_service:latest

  deploy:
    name: Deploy project on server
    runs-on: ubuntu-latest
    needs:
      - build_backend_and_push_to_docker_hub
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      # Копируем файлы на сервер через SCP (используем ключ или пароль)
      - name: Copy infra files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}       # 83.222.19.119
          username: ${{ secrets.USER }}   # root или deployer
          password: ${{ secrets.SSH_PASSWORD }}  # Пароль, если вход по паролю
          source: "." 
          target: "/root/ad_service/"  # Путь на сервере
          overwrite: true

      # Запускаем docker-compose на сервере
      - name: Run Docker Compose on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}  # Если вход по паролю
          script: |
            cd /root/education_backend/infra/
            docker-compose -f docker-compose.yml pull
            docker-compose -f docker-compose.yml up -d --build
            docker image prune -af