name: Deploy Ad Service with SSL

on:
  push:
    branches: [ hand_made ]

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: anton60874022/ad_service:latest

  deploy:
    name: Deploy to Server with SSL
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # === СОЗДАНИЕ .env ФАЙЛА НА GITHUB RUNNER ===
      - name: Create .env file from secrets
        run: |
          echo "🔧 Creating .env file from GitHub Secrets..."
          cat > .env << EOF
          # Django
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=${{ secrets.DEBUG }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          
          # Database
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          
          # Redis
          REDIS_URL=${{ secrets.REDIS_URL }}
          
          # Email (Mail.ru)
          EMAIL_HOST=${{ secrets.EMAIL_HOST }}
          EMAIL_PORT=${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS=${{ secrets.EMAIL_USE_TLS }}
          EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL=${{ secrets.EMAIL_HOST_USER }}
          
          # Security
          CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}
          EOF
          
          echo "✅ .env file created"
          echo "Content preview:"
          head -10 .env

      - name: Install Docker Compose on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "📦 Installing Docker Compose..."
            
            if command -v docker-compose &> /dev/null; then
              echo "✅ Docker Compose already installed"
              docker-compose --version
            else
              echo "Installing Docker Compose..."
              curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
              ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
              echo "✅ Docker Compose installed successfully"
              docker-compose --version
            fi

      - name: Clean server and setup directories (preserve DB)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🧹 Cleaning server (preserving database)..."
            cd /root
            
            # Останавливаем только контейнеры приложения
            if [ -d "ad_service" ]; then
              cd ad_service
              echo "Stopping application containers..."
              docker-compose down || true
              cd ..
            fi
            
            echo "Removing application containers..."
            docker ps -a | grep -E "(web|nginx|redis|db)" | awk '{print $1}' | xargs -r docker rm -f 2>/dev/null || true
            
            echo "Removing application images..."
            docker images | grep -E "(ad_service|anton60874022|postgres|redis|nginx)" | awk '{print $3}' | xargs -r docker rmi -f 2>/dev/null || true
            
            echo "Cleaning unused Docker resources..."
            docker system prune -f || true
            
            echo "Checking database volume..."
            docker volume ls | grep postgres_data || echo "Database volume not found (will be created)"
            
            echo "Recreating project directory..."
            rm -rf /root/ad_service
            mkdir -p /root/ad_service/nginx
            mkdir -p /root/ad_service/logs/nginx
            
            echo "✅ Server cleaned (database data preserved)"

      - name: Copy infrastructure files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "infra/"
          target: "/root/ad_service/"
          overwrite: true
          strip_components: 1

      - name: Copy .env to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ".env"
          target: "/root/ad_service/"
          overwrite: true

      - name: Ensure ports are free
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔧 Ensuring ports 80 and 443 are free..."
            
            echo "Checking port status:"
            netstat -tulpn | grep -E ':(80|443)' || echo "Ports appear to be free"
            
            # Останавливаем системные сервисы
            systemctl stop nginx 2>/dev/null || echo "nginx was not running or already stopped"
            systemctl stop apache2 2>/dev/null || echo "apache2 was not running or already stopped"
            
            echo "✅ Port check completed"

      - name: Deploy application first (without nginx)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            echo "🚀 Starting initial deployment (without nginx)..."
            cd /root/ad_service/
            
            echo "1. Verifying .env file..."
            ls -la .env
            echo "Email settings from .env:"
            grep EMAIL .env || echo "No EMAIL settings found"
            
            echo "2. Logging in to Docker Hub..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            echo "3. Pulling latest application image..."
            docker pull anton60874022/ad_service:latest
            
            echo "4. Starting containers without nginx..."
            docker-compose up -d db redis web
            
            echo "5. Waiting for database to be ready..."
            for i in {1..30}; do
              if docker-compose exec -T db pg_isready -U postgres 2>/dev/null; then
                echo "✅ Database is ready!"
                break
              else
                echo "⏳ Waiting for database... ($i/30)"
                sleep 2
              fi
            done
            
            echo "6. Waiting for application to initialize..."
            sleep 10
            
            echo "7. Running migrations..."
            docker-compose exec -T web python manage.py migrate --noinput
            
            echo "8. Collecting static files..."
            docker-compose exec -T web python manage.py collectstatic --noinput --clear || echo "Static collection completed"
            
            echo "✅ Initial deployment completed!"

      - name: Test email configuration
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "📧 Testing email configuration..."
            cd /root/ad_service/
            
            # Создаем скрипт для тестирования email с правильной инициализацией Django
            cat > /tmp/test_email.py << 'EOF'
            import os
            import sys
            
            # Настраиваем Django перед импортом настроек
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'ad_service.settings')
            
            # Импортируем и инициализируем Django
            import django
            django.setup()
            
            # Теперь можно импортировать настройки и отправлять email
            from django.core.mail import send_mail
            from django.conf import settings
            
            print("=== Email Configuration Test ===")
            print(f"EMAIL_BACKEND: {settings.EMAIL_BACKEND}")
            print(f"EMAIL_HOST: {settings.EMAIL_HOST}")
            print(f"EMAIL_PORT: {settings.EMAIL_PORT}")
            print(f"EMAIL_HOST_USER: {settings.EMAIL_HOST_USER}")
            print(f"DEFAULT_FROM_EMAIL: {settings.DEFAULT_FROM_EMAIL}")
            print(f"EMAIL_USE_TLS: {settings.EMAIL_USE_TLS}")
            
            try:
                print("\n📤 Attempting to send test email...")
                send_mail(
                    'Test Email from Production Server',
                    'This is a test email from mart.ktsf.ru deployment.',
                    settings.DEFAULT_FROM_EMAIL,
                    ['anton60874022@mail.ru'],
                    fail_silently=False,
                )
                print("✅ Test email sent successfully!")
                sys.exit(0)
            except Exception as e:
                print(f"❌ Email sending failed: {type(e).__name__}")
                print(f"Error details: {str(e)}")
                import traceback
                traceback.print_exc()
                sys.exit(1)
            EOF
            
            # Копируем скрипт в контейнер и выполняем
            CONTAINER_ID=$(docker-compose ps -q web)
            if [ -z "$CONTAINER_ID" ]; then
                echo "❌ Web container not running!"
                exit 1
            fi
            
            echo "Copying test script to container..."
            docker cp /tmp/test_email.py $CONTAINER_ID:/tmp/test_email.py
            
            echo "Executing email test..."
            if docker-compose exec -T web python /tmp/test_email.py; then
                echo "✅ Email test completed successfully"
            else
                echo "⚠️ Email test failed, but continuing deployment"
                echo "This might be due to:"
                echo "1. SMTP configuration issues"
                echo "2. Network/firewall restrictions"
                echo "3. Incorrect email credentials"
            fi

      - name: Install Certbot and obtain SSL certificate using standalone
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔐 Installing Certbot and obtaining SSL certificate..."
            
            # Обновляем пакеты
            apt-get update
            
            # Устанавливаем Certbot
            if ! command -v certbot &> /dev/null; then
                echo "Installing certbot..."
                apt-get install -y certbot
            else
                echo "✅ Certbot already installed"
            fi
            
            echo "Obtaining SSL certificate using standalone method..."
            
            # Останавливаем nginx контейнер, если он запущен (он может мешать)
            cd /root/ad_service
            docker-compose stop nginx 2>/dev/null || true
            
            # Получаем SSL сертификат
            if certbot certonly --standalone -d mart.ktsf.ru -d www.mart.ktsf.ru --non-interactive --agree-tos --email anton60874022@mail.ru; then
                echo "✅ SSL certificate obtained successfully!"
                
                # Проверяем полученные сертификаты
                echo "Certificate location:"
                ls -la /etc/letsencrypt/live/mart.ktsf.ru/
            else
                echo "❌ Failed to obtain SSL certificate"
                echo "Possible reasons:"
                echo "1. Domain mart.ktsf.ru doesn't point to this server"
                echo "2. Port 80 is blocked"
                echo "3. Certbot encountered an error"
                exit 1
            fi

      - name: Deploy nginx with SSL configuration
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            echo "🚀 Deploying nginx with SSL configuration..."
            cd /root/ad_service/
            
            echo "1. Starting nginx container..."
            docker-compose up -d nginx
            
            echo "2. Waiting for nginx to start..."
            sleep 5
            
            echo "3. Testing nginx configuration..."
            if docker-compose exec nginx nginx -t; then
                echo "✅ Nginx configuration is valid"
            else
                echo "❌ Nginx configuration test failed"
                echo "Checking nginx logs..."
                docker-compose logs nginx
                exit 1
            fi
            
            echo "4. Checking all services status..."
            docker-compose ps
            
            echo "✅ Nginx deployment completed!"

      - name: Setup SSL certificate auto-renewal
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔄 Setting up SSL certificate auto-renewal..."
            
            # Создаем скрипт для обновления сертификатов
            cat > /root/renew_ssl.sh << 'EOF'
            #!/bin/bash
            echo "$(date): Starting SSL certificate renewal..."
            
            cd /root/ad_service
            
            # Останавливаем nginx временно
            echo "Stopping nginx..."
            docker-compose stop nginx
            
            # Обновляем сертификаты
            echo "Renewing certificates..."
            if certbot renew --standalone --non-interactive; then
                echo "✅ SSL certificates renewed successfully"
                
                # Запускаем nginx обратно
                echo "Restarting nginx..."
                docker-compose start nginx
                
                # Перезагружаем nginx конфигурацию
                echo "Reloading nginx configuration..."
                docker-compose exec nginx nginx -s reload
                
                echo "✅ Nginx restarted with new certificates"
            else
                echo "❌ SSL certificate renewal failed"
                # В любом случае запускаем nginx обратно
                docker-compose start nginx
            fi
            EOF
            
            chmod +x /root/renew_ssl.sh
            
            # Добавляем cron задачу для обновления сертификатов
            echo "Adding cron job for SSL renewal..."
            (crontab -l 2>/dev/null | grep -v "/root/renew_ssl.sh"; echo "0 3 * * * /root/renew_ssl.sh >> /var/log/ssl-renewal.log 2>&1") | crontab -
            
            echo "✅ SSL auto-renewal configured!"
            echo "Cron jobs:"
            crontab -l

      - name: Verify HTTPS deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔍 HTTPS deployment verification..."
            cd /root/ad_service/
            
            echo "1. Container status:"
            docker-compose ps
            
            echo "2. Checking nginx logs for errors..."
            docker-compose logs nginx --tail=20 | grep -i error || echo "No nginx errors found"
            
            echo "3. Testing HTTPS accessibility..."
            sleep 3
            
            # Тестируем локально
            if curl -f -H "Host: mart.ktsf.ru" https://localhost/ --insecure; then
                echo "✅ HTTPS is working internally!"
            else
                echo "⚠️  HTTPS internal test failed"
                echo "Checking nginx error logs..."
                docker-compose exec nginx tail -20 /var/log/nginx/error.log || true
            fi
            
            echo "4. Testing HTTP to HTTPS redirect..."
            if curl -I -H "Host: mart.ktsf.ru" http://localhost/ 2>/dev/null | head -n 1 | grep -q "301"; then
                echo "✅ HTTP to HTTPS redirect is working"
            else
                echo "⚠️  HTTP to HTTPS redirect might not be configured"
            fi
            
            echo "🎉 Deployment verification complete!"
            echo "🔒 Your site should now be available at: https://mart.ktsf.ru"

      - name: Final HTTPS test from runner
        run: |
          echo "🔍 Testing HTTPS from GitHub runner..."
          echo "Note: This test might fail if DNS hasn't propagated yet or if there are network restrictions"
          sleep 15
          
          # Пробуем несколько раз с таймаутами
          for i in {1..5}; do
            echo "Attempt $i/5..."
            if curl -f -m 30 https://mart.ktsf.ru/; then
              echo "✅ HTTPS domain is accessible from internet!"
              break
            else
              echo "Attempt $i failed, waiting 5 seconds..."
              sleep 5
            fi
          done || echo "⚠️  Domain might not be accessible from runner (DNS/firewall issues)"