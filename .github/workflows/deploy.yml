name: Deploy Ad Service with SSL

on:
  push:
    branches: [ hand_made ]

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: anton60874022/ad_service:latest

  deploy:
    name: Deploy to Server with SSL
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Compose and setup SSL
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "📦 Setting up Docker Compose and SSL..."
            
            # Install Docker Compose if not exists
            if ! command -v docker-compose &> /dev/null; then
              curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
              ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
            fi

            # Install cron if not exists
            if ! command -v crontab &> /dev/null; then
              apt-get update && apt-get install -y cron
            fi

      - name: Clean and setup project directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🧹 Cleaning server (preserving database)..."
            cd /root
            
            if [ -d "ad_service" ]; then
              cd ad_service
              docker-compose down || true
            fi
            
            # Clean application containers
            docker ps -a | grep -E "(handmade_web|handmade_nginx|handmade_certbot|redis)" | awk '{print $1}' | xargs -r docker rm -f || true
            docker images | grep -E "(ad_service|anton60874022)" | awk '{print $3}' | xargs -r docker rmi -f || true
            docker system prune -f || true
            
            # Recreate project directory
            rm -rf /root/ad_service
            mkdir -p /root/ad_service/nginx/conf.d
            mkdir -p /root/ad_service/logs/nginx
            mkdir -p /root/ad_service/certbot_www
            mkdir -p /root/ad_service/certbot_data
            
            echo "✅ Server cleaned and directories created"

      - name: Copy infrastructure files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "infra/"
          target: "/root/ad_service/"
          overwrite: true
          strip_components: 1

      - name: Copy SSL scripts and configs
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: 
            - "certbot-renew.sh"
            - ".env"
          target: "/root/ad_service/"
          overwrite: true

      - name: Deploy with SSL setup
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            echo "🚀 Starting deployment with SSL..."
            cd /root/ad_service/
            
            # Make SSL script executable
            chmod +x certbot-renew.sh
            
            echo "1. Pulling latest images..."
            docker pull anton60874022/ad_service:latest
            
            echo "2. Starting services without SSL first..."
            docker-compose up -d db redis web
            
            echo "3. Setting up SSL certificate..."
            ./certbot-renew.sh
            
            echo "4. Running migrations..."
            docker-compose exec -T web python manage.py migrate --noinput
            
            echo "5. Checking services..."
            docker-compose ps
            
            echo "✅ Deployment with SSL completed!"

      - name: Verify SSL deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔍 Verifying SSL deployment..."
            cd /root/ad_service/
            
            echo "1. Container status:"
            docker-compose ps
            
            echo "2. Checking SSL certificate..."
            docker-compose exec -T nginx nginx -t
            
            echo "3. Testing HTTPS access..."
            curl -I https://mart.ktsf.ru/ || echo "HTTPS test completed"
            
            echo "4. Checking certificate renewal cron job..."
            crontab -l | grep certbot || echo "Cron job not found (may need manual setup)"
            
            echo "🎉 SSL deployment verification complete!"