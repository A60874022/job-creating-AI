name: Workflow For Build and Deploy

on:
  push:
    branches:
      - hand_made

jobs:
  build_backend_and_push_to_docker_hub:
    name: Push docker image of backend to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: anton60874022/ad_service:latest

  deploy:
    name: Deploy project on server
    runs-on: ubuntu-latest
    needs:
      - build_backend_and_push_to_docker_hub
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      # Создаем файл с SSH ключом
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      # Тестовое подключение по SSH
      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.USER }}@${{ secrets.HOST }} "
            echo '✅ SSH подключение успешно!'
            whoami
            pwd
          "

      # Копируем файлы на сервер через SCP
      - name: Copy files via SCP
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -r ./* ${{ secrets.USER }}@${{ secrets.HOST }}:/root/ad_service/

      # Запускаем docker-compose на сервере
      - name: Run Docker Compose on Server
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.USER }}@${{ secrets.HOST }} "
            echo '🚀 Начинаем деплой...'
            cd /root/ad_service/
            
            echo '1. Проверяем наличие docker-compose.yml'
            ls -la
            
            echo '2. Обновляем образы из Docker Hub'
            docker-compose -f docker-compose.yml pull || echo '⚠️ Не удалось обновить образы, продолжаем...'
            
            echo '3. Перезапускаем контейнеры'
            docker-compose -f docker-compose.yml up -d --build
            
            echo '4. Очищаем неиспользуемые образы'
            docker image prune -af
            
            echo '5. Проверяем статус контейнеров'
            docker-compose -f docker-compose.yml ps
            
            echo '✅ Деплой успешно завершен!'
          "