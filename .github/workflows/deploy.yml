name: Deploy Ad Service

on:
  push:
    branches: [ hand_made ]

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: anton60874022/ad_service:latest

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "docker-compose.yml,nginx/"
          target: "/root/ad_service/"
          overwrite: true

      - name: Deploy application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🚀 Starting deployment..."
            cd /root/ad_service/
            
            echo "1. Creating directories..."
            mkdir -p logs/nginx
            
            echo "2. Setting permissions..."
            chmod -R 755 nginx logs
            
            echo "3. Pulling latest images..."
            docker-compose pull
            
            echo "4. Stopping old containers..."
            docker-compose down --remove-orphans
            
            echo "5. Starting new containers..."
            docker-compose up -d
            
            echo "6. Checking status..."
            docker-compose ps
            
            echo "7. Checking logs..."
            docker-compose logs --tail=20 web
            
            echo "✅ Deployment completed!"