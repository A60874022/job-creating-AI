name: Deploy Ad Service

on:
  push:
    branches: [ hand_made ]

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: anton60874022/ad_service:latest

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean server and setup directories (preserve DB)
        uses: appleboy/ssh-action@master
        with:
          host: '185.207.0.125'
          username: 'root'  # предположительно root, если нет - укажите правильного пользователя
          password: '!L3VfMAG*sjX'
          script: |
            echo "🧹 Cleaning server (preserving database)..."
            cd /root
            
            # Останавливаем контейнеры если есть (сохраняем тома)
            if [ -d "ad_service" ]; then
              cd ad_service
              docker-compose down || true
            fi
            
            # Удаляем только контейнеры приложения, НЕ тома БД
            echo "Removing application containers..."
            docker ps -a | grep -E "(handmade_web|handmade_nginx|redis)" | awk '{print $1}' | xargs -r docker rm -f || true
            
            # Удаляем образы приложения, но не postgres
            echo "Removing application images..."
            docker images | grep -E "(ad_service|anton60874022)" | awk '{print $3}' | xargs -r docker rmi -f || true
            
            # Очищаем неиспользуемые ресурсы, но сохраняем тома
            echo "Cleaning unused Docker resources..."
            docker system prune -f || true
            
            # Проверяем что том БД существует
            echo "Checking database volume..."
            docker volume ls | grep postgres_data || echo "Database volume not found (will be created)"
            
            # Очищаем и пересоздаем папку проекта (тома БД сохраняются автоматически)
            echo "Recreating project directory..."
            rm -rf /root/ad_service
            mkdir -p /root/ad_service/nginx/conf.d
            mkdir -p /root/ad_service/logs/nginx
            
            echo "✅ Server cleaned (database data preserved)"

      - name: Copy infrastructure files to server
        uses: appleboy/scp-action@master
        with:
          host: '185.207.0.125'
          username: 'root'  # предположительно root, если нет - укажите правильного пользователя
          password: '!L3VfMAG*sjX'
          source: "infra/"
          target: "/root/ad_service/"
          overwrite: true
          strip_components: 1

      - name: Copy .env to server
        uses: appleboy/scp-action@master
        with:
          host: '185.207.0.125'
          username: 'root'  # предположительно root, если нет - укажите правильного пользователя
          password: '!L3VfMAG*sjX'
          source: ".env"
          target: "/root/ad_service/"
          overwrite: true

      - name: Deploy application with database preservation
        uses: appleboy/ssh-action@master
        with:
          host: '185.207.0.125'
          username: 'root'  # предположительно root, если нет - укажите правильного пользователя
          password: '!L3VfMAG*sjX'
          script: |
            set -e
            echo "🚀 Starting deployment (with database preservation)..."
            cd /root/ad_service/
            
            echo "=== Current directory structure ==="
            ls -la
            echo "=== Nginx configuration ==="
            ls -la nginx/ || echo "Nginx directory not found"
            
            echo "1. Pulling latest application image..."
            docker pull anton60874022/ad_service:latest
            
            echo "2. Starting containers (database volume will be reused)..."
            docker-compose up -d
            
            echo "3. Waiting for database to be ready..."
            # Ждем пока PostgreSQL будет готов принимать подключения
            for i in {1..30}; do
              if docker-compose exec -T db pg_isready -U postgres; then
                echo "✅ Database is ready!"
                break
              else
                echo "⏳ Waiting for database... ($i/30)"
                sleep 2
              fi
            done
            
            echo "4. Waiting for application to start..."
            sleep 15
            
            echo "5. Running migrations..."
            docker-compose exec -T web python manage.py migrate --noinput
            
            echo "6. Checking services status..."
            docker-compose ps
            
            echo "✅ Deployment completed with database preservation!"

      - name: Verify deployment and data integrity
        uses: appleboy/ssh-action@master
        with:
          host: '185.207.0.125'
          username: 'root'  # предположительно root, если нет - укажите правильного пользователя
          password: '!L3VfMAG*sjX'
          script: |
            echo "🔍 Final verification (checking database)..."
            cd /root/ad_service/
            
            echo "1. Container status:"
            docker-compose ps
            
            echo "2. Checking if application can connect to database..."
            docker-compose exec -T web python manage.py check --database default
            
            echo "3. Recent application logs:"
            docker-compose logs --tail=10 web
            
            echo "4. Checking web service response..."
            curl -f http://localhost:8000/ || curl -f http://localhost/ || echo "Application might be starting..."
            
            echo "🎉 Deployment verification complete! Database preserved."