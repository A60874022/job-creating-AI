name: Deploy Ad Service with Auto SSL

on:
  push:
    branches: [ hand_made ]

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: anton60874022/ad_service:latest

  deploy:
    name: Deploy to Server with Auto SSL
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Compose on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "📦 Installing Docker Compose..."
            if command -v docker-compose &> /dev/null; then
              echo "✅ Docker Compose already installed"
              docker-compose --version
            else
              echo "Installing Docker Compose..."
              curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
              ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
              echo "✅ Docker Compose installed successfully"
              docker-compose --version
            fi

      - name: Clean server and setup directories
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🧹 Cleaning server..."
            cd /root
            
            if [ -d "ad_service" ]; then
              cd ad_service
              docker-compose down || true
            fi
            
            echo "Removing application containers..."
            docker ps -a | grep -E "(ad_service_)" | awk '{print $1}' | xargs -r docker rm -f || true
            
            echo "Removing application images..."
            docker images | grep -E "(ad_service|anton60874022)" | awk '{print $3}' | xargs -r docker rmi -f || true
            
            echo "Removing old database volume (incompatible version)..."
            docker volume rm ad_service_postgres_data || true
            
            echo "Cleaning unused Docker resources..."
            docker system prune -f || true
            
            echo "Recreating project directory..."
            rm -rf /root/ad_service
            mkdir -p /root/ad_service/nginx
            mkdir -p /root/ad_service/logs/nginx
            
            echo "✅ Server cleaned"

      - name: Copy infrastructure files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "infra/"
          target: "/root/ad_service/"
          overwrite: true
          strip_components: 1

      - name: Copy .env to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ".env"
          target: "/root/ad_service/"
          overwrite: true

      - name: Deploy application with automatic SSL
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            echo "🚀 Starting deployment with automatic SSL..."
            cd /root/ad_service/
            
            echo "1. Creating necessary directories..."
            mkdir -p nginx/conf.d
            mkdir -p logs/nginx
            
            echo "2. Pulling latest images..."
            docker pull anton60874022/ad_service:latest
            docker pull nginx:1.21-alpine
            docker pull certbot/certbot
            docker pull postgres:14
            docker pull redis:7-alpine
            
            echo "3. Starting database and redis first..."
            docker-compose up -d db redis
            
            echo "4. Waiting for database to be ready (30 seconds)..."
            sleep 30
            
            echo "5. Checking database status..."
            if docker-compose exec -T db pg_isready -U $POSTGRES_USER; then
              echo "✅ Database is ready"
            else
              echo "⚠️ Database not ready yet, waiting additional 30 seconds..."
              sleep 30
            fi
            
            echo "6. Starting web service..."
            docker-compose up -d web
            
            echo "7. Waiting for web to initialize (20 seconds)..."
            sleep 20
            
            echo "8. Starting nginx (HTTP only for certificate acquisition)..."
            docker-compose up -d nginx
            
            echo "9. Waiting for nginx to start (10 seconds)..."
            sleep 10
            
            echo "10. Obtaining SSL certificates..."
            if docker-compose run --rm certbot certonly --webroot -w /var/www/certbot --email $ADMIN_EMAIL -d mart.ktsf.ru -d www.mart.ktsf.ru --agree-tos --non-interactive --keep-until-expiring; then
              echo "✅ SSL certificates obtained successfully"
              
              echo "11. Updating nginx configuration to enable HTTPS..."
              # Update nginx config to redirect HTTP to HTTPS
              cat > nginx/nginx.conf << 'EOF'
              events {
                  worker_connections 1024;
              }

              http {
                  include /etc/nginx/mime.types;
                  default_type application/octet-stream;

                  server_tokens off;
                  sendfile on;
                  tcp_nopush on;
                  tcp_nodelay on;
                  keepalive_timeout 65;
                  types_hash_max_size 2048;

                  client_max_body_size 20M;
                  client_body_timeout 60s;
                  client_header_timeout 60s;
                  client_body_buffer_size 128K;
                  client_body_temp_path /var/cache/nginx/client_temp 1 2;

                  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                                  '$status $body_bytes_sent "$http_referer" '
                                  '"$http_user_agent" "$http_x_forwarded_for" '
                                  'rt=$request_time uct="$upstream_connect_time"';

                  access_log /var/log/nginx/access.log main;
                  error_log /var/log/nginx/error.log warn;

                  upstream django {
                      server web:8000;
                  }

                  # HTTP redirect to HTTPS
                  server {
                      listen 80;
                      server_name mart.ktsf.ru www.mart.ktsf.ru;
                      
                      location /.well-known/acme-challenge/ {
                          root /var/www/certbot;
                      }
                      
                      location / {
                          return 301 https://$host$request_uri;
                      }
                  }

                  # HTTPS server
                  server {
                      listen 443 ssl http2;
                      server_name mart.ktsf.ru www.mart.ktsf.ru;

                      ssl_certificate /etc/letsencrypt/live/mart.ktsf.ru/fullchain.pem;
                      ssl_certificate_key /etc/letsencrypt/live/mart.ktsf.ru/privkey.pem;
                      
                      ssl_protocols TLSv1.2 TLSv1.3;
                      ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
                      ssl_prefer_server_ciphers off;
                      ssl_session_cache shared:SSL:10m;
                      ssl_session_timeout 1d;

                      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
                      add_header X-Frame-Options "SAMEORIGIN" always;
                      add_header X-Content-Type-Options "nosniff" always;
                      add_header X-XSS-Protection "1; mode=block" always;
                      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;

                      client_max_body_size 20M;
                      client_body_timeout 120s;
                      client_header_timeout 120s;
                      proxy_connect_timeout 120s;
                      proxy_send_timeout 120s;
                      proxy_read_timeout 120s;

                      location /static/ {
                          alias /app/staticfiles/;
                          expires 1y;
                          add_header Cache-Control "public, immutable";
                          access_log off;
                      }

                      location /media/ {
                          alias /app/media/;
                          expires 30d;
                          add_header Cache-Control "public";
                          access_log off;
                          client_max_body_size 20M;
                      }

                      location /ws/ {
                          proxy_pass http://django;
                          proxy_http_version 1.1;
                          proxy_set_header Upgrade $http_upgrade;
                          proxy_set_header Connection "upgrade";
                          proxy_set_header Host $host;
                          proxy_set_header X-Real-IP $remote_addr;
                          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                          proxy_set_header X-Forwarded-Proto $scheme;
                          proxy_read_timeout 86400;
                      }

                      location / {
                          proxy_pass http://django;
                          proxy_set_header Host $host;
                          proxy_set_header X-Real-IP $remote_addr;
                          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                          proxy_set_header X-Forwarded-Proto $scheme;
                          
                          proxy_connect_timeout 120s;
                          proxy_send_timeout 120s;
                          proxy_read_timeout 120s;
                          
                          proxy_buffering on;
                          proxy_buffer_size 128k;
                          proxy_buffers 8 256k;
                          proxy_busy_buffers_size 256k;
                          
                          client_max_body_size 20M;
                          client_body_timeout 120s;
                      }
                  }
              }
              EOF
              
              echo "12. Restarting nginx with SSL configuration..."
              docker-compose restart nginx
              
              echo "13. Setting up automatic SSL renewal..."
              (crontab -l 2>/dev/null | grep -v "certbot renew"; echo "0 12 * * * /usr/bin/docker-compose -f /root/ad_service/docker-compose.yml run --rm certbot renew --quiet && /usr/bin/docker-compose -f /root/ad_service/docker-compose.yml restart nginx") | crontab -
              
            else
              echo "⚠️ Certbot had issues, but application is running on HTTP"
            fi
            
            echo "✅ Deployment completed!"

      - name: Final verification
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔍 Final verification..."
            cd /root/ad_service/
            
            echo "1. Container status:"
            docker-compose ps
            
            echo "2. Service health check..."
            echo "=== Database ==="
            docker-compose exec -T db pg_isready -U $POSTGRES_USER && echo "✅ Database healthy" || echo "❌ Database issues"
            
            echo "=== Redis ==="
            docker-compose exec -T redis redis-cli ping && echo "✅ Redis healthy" || echo "❌ Redis issues"
            
            echo "3. Testing HTTP access..."
            curl -f http://localhost/ > /dev/null 2>&1 && echo "✅ HTTP is working" || echo "⚠️ HTTP not working"
            
            echo "4. Testing HTTPS access..."
            curl -k -f https://localhost/ > /dev/null 2>&1 && echo "✅ HTTPS is working" || echo "⚠️ HTTPS not working"
            
            echo "5. Checking SSL certificates..."
            docker-compose run --rm certbot certificates || echo "Certificate check"
            
            echo "🎉 Deployment complete!"учше