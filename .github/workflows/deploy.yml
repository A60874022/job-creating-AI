name: Workflow For Build and Deploy

on:
  push:
    branches:
      - hand_made

jobs:
  build_backend_and_push_to_docker_hub:
    name: Push docker image of backend to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: anton60874022/ad_service:latest

  deploy:
    name: Deploy project on server
    runs-on: ubuntu-latest
    needs:
      - build_backend_and_push_to_docker_hub
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      # Тестовое подключение по SSH для проверки аутентификации
      - name: Test SSH connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "✅ SSH подключение успешно!"
            echo "Текущий пользователь: $(whoami)"
            echo "Текущая директория: $(pwd)"
            echo "Проверка Docker:"
            docker --version
            docker-compose --version

      # Копируем файлы на сервер через SCP (используем ТОЛЬКО SSH ключ)
      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "."
          target: "/root/ad_service/"
          overwrite: true
          strip_components: 0

      # Запускаем docker-compose на сервере
      - name: Run Docker Compose on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Начинаем деплой..."
            cd /root/ad_service/
            
            echo "1. Проверяем наличие docker-compose.yml"
            ls -la
            
            echo "2. Обновляем образы из Docker Hub"
            docker-compose -f docker-compose.yml pull || echo "⚠️ Не удалось обновить образы, продолжаем..."
            
            echo "3. Перезапускаем контейнеры"
            docker-compose -f docker-compose.yml up -d --build
            
            echo "4. Очищаем неиспользуемые образы"
            docker image prune -af
            
            echo "5. Проверяем статус контейнеров"
            docker-compose -f docker-compose.yml ps
            
            echo "✅ Деплой успешно завершен!"